<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Manut AI is offline</title>
<!-- What the owner's web app's service worker shows when the phone is offline and it has no copy of the app's page
     (src/app/sw.ts). It stands alone: every style is here, and it names nothing it would have to fetch. -->
<style>
:root{--main:#FBFAF7;--bg:#FFFFFF;--line:#E7E5DF;--ink:#111110;--mut:#6A6964;--pri:#1A1A19;--onpri:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--main:#171716;--bg:#1F1F1D;--line:#30302D;--ink:#F3F2EE;--mut:#A3A29C;--pri:#F3F2EE;--onpri:#111110}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--main);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px 40px;display:flex;flex-direction:column;gap:16px}
.box{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:16px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:17px;font-weight:600}
p{margin:0}
.mut{color:var(--mut);font-size:13.5px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:8px;background:var(--pri);color:var(--onpri);font-weight:500;text-decoration:none;align-self:flex-start}
</style>
</head>
<body>
<main>
<div style="font-weight:600;font-size:17px">Manut AI</div>
<section class="box">
<h1>You're offline</h1>
<p>Manut AI needs the internet to show what waits for you and to send your answers. Nothing can be answered offline.</p>
<p class="mut">Connect to the internet, then open Manut AI again.</p>
<a href="/app/">Try again</a>
</section>
</main>
</body>
</html>
