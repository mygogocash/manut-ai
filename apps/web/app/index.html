<!doctype html>
<html lang="en" class="r">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The owner's web app (src/app, docs/web-app.md). Its page carries no token, and sends no Referer anyway. -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<!-- The page's own background, light and dark (packages/ui-kit/app.css, --main), so the phone's bars match it. -->
<meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171716" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Manut AI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png">
<title>Manut AI</title>
<!-- Nothing here comes from another origin: the app links the brand's fonts itself (src/fonts.ts). -->
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/app/main.tsx"></script>
</body>
</html>
