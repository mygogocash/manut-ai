# Weekly dependency updates for the three ecosystems in this repository. Minor and patch updates arrive grouped,
# one pull request per ecosystem; a major update arrives on its own, because it can need code changes.
#
# Version updates target pilot/week-1, where the work happens (item 127, 26 Nov 2026), through `target-branch` on each
# entry: Dependabot then reads the manifests on that branch and opens its pull requests against it. GitHub's
# Dependabot options reference: with target-branch set, the entry's options (schedule, cooldown, groups) apply to
# version updates only, and security updates always use the default branch, main. This file takes effect from main,
# the default branch, so the change starts once it is merged there. When the working branch takes a new name, these
# three lines change with it, or Dependabot keeps updating a finished branch.
#
# A version is only offered once it is seven days old, so a hijacked release has time to be noticed and pulled
# before it reaches a pull request here. Security updates are never delayed by this. Seven days also clears pnpm's
# own one-day minimumReleaseAge, which every frozen install re-checks, so an update does not trip it in CI.
version: 2

updates:
  # The pnpm workspace: the root package.json, every apps/* and packages/* manifest, and pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    target-branch: "pilot/week-1"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Bangkok
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # The desktop app's Rust crates.
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    target-branch: "pilot/week-1"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Bangkok
    cooldown:
      default-days: 7
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  # The actions the workflows use, pinned to commit SHAs; Dependabot updates the SHA and the version comment
  # together. "/" covers .github/workflows, and the glob covers the local actions under .github/actions.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    target-branch: "pilot/week-1"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Bangkok
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
