# Deploys the pilot to Cloudflare's dev environment, and nothing else. It is started by hand (Actions, Deploy dev,
# Run workflow) on a pilot/* branch: the dev Environment refuses every other branch and holds the only Cloudflare
# credentials this repository has. The environment is written into each command and never taken as an input, so
# this workflow cannot reach staging or production; those deploys need the owner.
name: Deploy dev

on:
  workflow_dispatch:

# One deploy at a time. A second one waits instead of cancelling a deploy halfway through.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      # Fails in seconds, with the fix in the message, when the owner has not added the secrets yet. Only whether
      # each secret is set reaches this step, never its value.
      - name: Check the dev Environment has its Cloudflare secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the dev Environment's secrets, then run this again."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The install runs before any Cloudflare credential is in a step's environment, so install scripts never
      # see them.
      - uses: ./.github/actions/setup-workspace

      # Resolves both configs the way `wrangler deploy --env dev` will and refuses any Worker whose name does not
      # end in -dev, so a later edit to a config cannot turn this into a staging or production deploy.
      - name: Check that both deploys stay in dev
        working-directory: apps/api
        run: node ../../.github/scripts/check-dev-deploys.mjs wrangler.web.jsonc wrangler.jsonc

      # The pages Worker first, then the API Worker. Only these two steps see the Cloudflare secrets.
      - name: Deploy the pages Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.web.jsonc --env dev

      - name: Deploy the API Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env dev
