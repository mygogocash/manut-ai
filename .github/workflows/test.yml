# Runs every package's tests and type checks on Linux, so a pull request is checked
# without tying up a developer's Mac. Linux only: macOS minutes cost ten times as much.
name: Test

# Manual only for now: on 23 Nov 2026 GitHub refused to start jobs for this organisation
# ("recent account payments have failed or your spending limit needs to be increased").
# Once billing is sorted, put `pull_request:` and `push: branches: [main]` back.
on:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
