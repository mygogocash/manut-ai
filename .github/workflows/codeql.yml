# Code scanning with CodeQL: the TypeScript and JavaScript of every app and package, the desktop app's Rust, and
# these workflow files themselves. Alerts appear under the repository's Security tab, and a pull request is
# annotated where it adds one.
name: CodeQL

on:
  # A branch with a pull request is scanned by the pull request's run, which is also where an alert is annotated, so a
  # push to a pilot branch is not scanned a second time (the owner, 25 Nov 2026: skip what is not used).
  pull_request:
  push:
    branches: [main]
  # Weekly, so new queries also reach code nobody has touched. GitHub runs schedules from the default branch only.
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC, 09:17 in Bangkok

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Nothing by default; the one job asks for exactly what it needs.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A private repository would also need `actions: read`; this one is public.
    permissions:
      contents: read # checks out the code to analyse
      security-events: write # uploads the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        # CodeQL supports Rust editions 2021 and 2024 (src-tauri is 2021) with build mode `none`.
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Rust analysis runs the crates' build scripts through rust-analyzer, and the GTK and WebKit ones look for
      # their system libraries. Without them, part of the desktop app's code would go unanalysed.
      - if: matrix.language == 'rust'
        uses: ./.github/actions/tauri-linux-deps
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          # CodeQL reads all three languages from source; nothing is built.
          build-mode: none
          # The default queries plus the wider security set: the app holds credentials and moves money, so a few
          # more alerts to triage are worth the extra coverage.
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
