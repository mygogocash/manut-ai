# The desktop app's release builds. Read docs/releasing.md before changing this file.
#
# It runs only when someone starts it by hand or pushes a tag shaped desktop-vX.Y.Z, never on an ordinary push or pull
# request: the organisation pays for Actions minutes, and a macOS minute costs ten times a Linux one.
#
# The Mac app is built twice (Apple silicon and Intel), then Linux (AppImage and .deb), then Windows (the NSIS installer),
# all into ONE DRAFT release. Nothing here publishes it: the owner does, and the in-app updater's latest.json lives in that
# release, so updates reach people only when the owner publishes. Linux and Windows joined the release on 27 Nov 2026
# (item 111, the owner's decision); before that only the Mac was released. Neither is signed: Linux needs no signing, and a
# trusted Windows signature needs a certificate the owner buys, so SmartScreen warns until then
# (docs/release-notes-template.md says so for the people who download it).
#
# The builds run one after the other, in this order, because each one reads the draft's latest.json and adds its own
# platform to it (see the Mac job's comment). The nightly channel is nightly-desktop.yml.
#
# The signing secrets (the five APPLE_ ones and the updater key) are secrets of the `release` GitHub Environment, not of
# the repository (item 141, the sixth security read's M2): only runs of `main` or of a desktop-v tag may use it, and the
# owner approves each job that names it before it starts. So a branch pushed with its own copy of this file reads no key.
# Every job here names it, because every one signs update files; docs/releasing.md has the owner's steps.
#
# Lifted in outline from Oh My Hermes' omher-release.yml (MIT): the tag check and the matrix of targets.
name: Release desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

# One release run at a time per ref, and a started build is never cancelled half way through a notarization.
concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

# Read-only unless a job below says otherwise.
permissions:
  contents: read

jobs:
  mac:
    name: Mac (${{ matrix.label }})
    strategy:
      fail-fast: false
      # One chip at a time. The action builds first, then looks for a draft with this tag and makes one only if it finds
      # none, then reads the draft's latest.json, adds its own chip and uploads it again (its create-release.ts and
      # upload-version-json.ts at the pinned commit). Two builds finishing together could each make a draft, or each
      # write a latest.json that names only its own chip. The second build finds the first one's draft and its
      # latest.json. It costs no more macOS minutes, only a longer wait.
      max-parallel: 1
      matrix:
        include:
          # Two builds and not one universal build: each download is half the size, and the updater's latest.json names
          # darwin-aarch64 and darwin-x86_64 as Tauri's GitHub guide builds them.
          - target: aarch64-apple-darwin
            label: Apple silicon
          - target: x86_64-apple-darwin
            label: Intel
    runs-on: macos-latest
    timeout-minutes: 90
    # The Apple secrets and the updater key are the `release` environment's (the header says why).
    environment: release
    # Only this job writes: it makes the draft release and uploads into it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Check the tag matches the app's version
        run: |
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "desktop-v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the app's version ($version): expected desktop-v$version."
            exit 1
          fi
      - name: Install stable Rust and the target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}
      # A secret cannot be read in an `if`, so this step turns "are they all there" into one yes or no. It prints
      # names only, never a value. A partly filled set is treated as absent, so one missing secret never fails the run.
      - name: Check which Apple secrets are present
        id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -z "$missing" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "### Mac ${{ matrix.label }}: signed and notarized" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Mac ${{ matrix.label }}: UNSIGNED build"
              echo
              echo "This build is not signed with a Developer ID and is not notarized, so macOS will warn before it opens."
              echo "Do not publish it as the release. Missing GitHub secrets:${missing:-" none"}. docs/releasing.md says where each comes from."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Unsigned Mac build (${{ matrix.label }}). Missing secrets:$missing"
          fi
      # The keychain password is made here for this one run and never leaves it. The certificate is imported as Tauri's
      # macOS signing guide shows (https://v2.tauri.app/distribute/sign/macos/), and the Developer ID Application
      # identity is taken from the keychain by its type, so no identity name is stored anywhere.
      - name: Import the Developer ID certificate
        if: steps.apple.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          rm -f "$RUNNER_TEMP/certificate.p12"
          identity="$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -n 1 | sed -E 's/^[^"]*"([^"]+)".*$/\1/')"
          if [ -z "$identity" ]; then
            echo "::error::The imported certificate is not a Developer ID Application certificate."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      # Signed and notarized: Tauri signs the app with the identity and sends it to Apple when the three notarization
      # values are set. The two TAURI_SIGNING_ values sign the updater's bundle, which is a different key from Apple's.
      - name: Build, sign, notarize and draft the release
        if: steps.apple.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: Manut AI __VERSION__ (draft)
          releaseBody: Draft built by the Release desktop workflow. Check the signature, then publish. See docs/releasing.md.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
      # Unsigned: an ad-hoc identity ("-") so an Apple silicon Mac can run it at all, which the Tauri guide recommends
      # for builds with no certificate. The base config has no signingIdentity so that the signed step above takes its
      # identity from APPLE_SIGNING_IDENTITY alone.
      - name: Build unsigned and draft the release
        if: steps.apple.outputs.signed != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: Manut AI __VERSION__ (draft, UNSIGNED)
          releaseBody: UNSIGNED draft built by the Release desktop workflow. Do not publish it. See docs/releasing.md.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
      # Checks the built app, so a signed run that did not really sign or notarize fails here and not in a customer's hands.
      - name: Check the app is signed and notarized
        if: steps.apple.outputs.signed == 'true'
        run: |
          app="$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q "Authority=Developer ID Application"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          echo "Checked: Developer ID signature, stapled notarization ticket and Gatekeeper's assessment." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the keychain
        if: ${{ always() && steps.apple.outputs.signed == 'true' }}
        run: security delete-keychain build.keychain || true

  linux:
    # An AppImage and a .deb, unsigned (Linux needs no signing). After the Mac job so the draft and its latest.json exist
    # and are never written by two builds at once, and never when the Mac job did not succeed (that job checks the tag).
    name: Linux (AppImage and .deb)
    needs: mac
    if: ${{ !cancelled() && needs.mac.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # The updater key is the `release` environment's, as for the Mac job.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/tauri-linux-deps
      # patchelf is on Tauri's own Linux list for bundling an AppImage and not on CI's list.
      - run: sudo apt-get install -y patchelf
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: linux
      # The updater key signs the AppImage's .sig, which adds linux-x86_64 to latest.json. The .deb is not updated in place.
      - name: Build and add to the draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: Manut AI __VERSION__ (draft)
          releaseBody: Draft built by the Release desktop workflow. See docs/releasing.md.
          releaseDraft: true
          prerelease: false
          args: --bundles appimage,deb

  windows:
    # The NSIS installer, unsigned until the owner buys a code-signing certificate: Windows SmartScreen warns before it
    # opens (docs/release-notes-template.md). After the Linux job, for the same reason as the Linux job after the Mac job.
    name: Windows installer (unsigned)
    needs: [mac, linux]
    if: ${{ !cancelled() && needs.mac.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 60
    # The updater key is the `release` environment's, as for the Mac job.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install stable Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: windows
      # The installer's .sig, made with the updater key, adds windows-x86_64 to latest.json. The action prefers the NSIS
      # file over a .msi for it, though only NSIS is built.
      - name: Build and add to the draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: Manut AI __VERSION__ (draft)
          releaseBody: Draft built by the Release desktop workflow. See docs/releasing.md.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: --bundles nsis
      - name: Note that it is unsigned
        shell: bash
        run: |
          echo "### Windows installer: UNSIGNED. SmartScreen warns until the owner buys a code-signing certificate." >> "$GITHUB_STEP_SUMMARY"
